name: powerleft
description: Offline battery runtime and power-station sizing calculator.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: 3.4.3
  drift: 2.35.1
  drift_flutter: 0.3.1
  shared_preferences: 2.5.6
  google_mobile_ads: 9.1.0
  uuid: 4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
  drift_dev: 2.35.1
  build_runner: 2.16.1
  # build_runner 2.16.1 requires the pre-14.5 AnalysisOptionsImpl setter.
  analyzer: 14.4.0
  shared_preferences_platform_interface: 2.4.2

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: PowerLeftSans
      fonts:
        - asset: assets/fonts/NotoSansKR.ttf
    - family: PowerLeftJapanese
      fonts:
        - asset: assets/fonts/NotoSansJP.ttf
  assets:
    - assets/fonts/OFL.txt
    - assets/fonts/OFL-JP.txt
    - assets/config/preset_values.json
    - assets/data/appliance_library.json
