name: PowerLeft actual App Store screenshots
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: powerleft-store-screenshots
  cancel-in-progress: false
jobs:
  capture-flow:
    if: github.repository == 'baewumnote-studio/powerleft-ios-public-build' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the verified Flutter toolchain
        run: |
          git clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/powerleft-flutter"
          echo "$RUNNER_TEMP/powerleft-flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/powerleft-flutter/bin/flutter" config --no-analytics
      - name: Check all localized capture paths before using macOS
        run: |
          flutter pub get --enforce-lockfile
          python3 - <<'PY'
          from pathlib import Path
          source=Path('tool/store_capture_target.dart').read_text()
          Path('test/store_capture_host_test.dart').write_text(source.replace('../test/support/preferences_test_support.dart','support/preferences_test_support.dart'))
          PY
          flutter test --no-pub --dart-define=POWERLEFT_DISABLE_ADS_FOR_TESTING=true --dart-define=POWERLEFT_CAPTURE_HOST_CHECK=true test/store_capture_host_test.dart
  capture:
    needs: capture-flow
    if: github.repository == 'baewumnote-studio/powerleft-ios-public-build' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      COCOAPODS_DISABLE_STATS: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Confirm the approved release UI is preserved
        run: |
          python3 - <<'PY'
          import subprocess
          changed = subprocess.check_output(['git','diff','--name-only','a8ea9b39b73646a05761d4f80150fab0546c5579','HEAD'],text=True).splitlines()
          allowed = {'.github/workflows/store-screenshots.yml','tool/store_capture_target.dart','tool/store_capture_driver.dart'}
          assert set(changed).issubset(allowed), changed
          print('Release code, assets, dependencies and native configuration unchanged.')
          PY
      - name: Install the previously verified Flutter toolchain
        run: |
          test -d "$DEVELOPER_DIR"
          git clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/powerleft-flutter"
          echo "$RUNNER_TEMP/powerleft-flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/powerleft-flutter/bin/flutter" config --no-analytics
          "$RUNNER_TEMP/powerleft-flutter/bin/flutter" precache --ios
      - name: Wait for the simulator log reader before launch
        run: |
          python3 - <<'PY'
          import os,pathlib
          # Flutter issue #181771: a simulator log-reader race loses the VM URL.
          # Apply the readiness wait only to this disposable capture SDK.
          sdk=pathlib.Path(os.environ['RUNNER_TEMP'])/'powerleft-flutter'
          path=sdk/'packages/flutter_tools/lib/src/ios/simulators.dart'
          source=path.read_text()
          def replace_once(old,new):
            global source
            assert source.count(old)==1, 'Flutter capture-tool patch no longer matches.'
            source=source.replace(old,new)
          replace_once('    // Launch the updated application in the simulator.', '''    // Ensure the native log stream is listening before the app logs its VM URL.
              if (debuggingOptions.debuggingEnabled) {
                final reader = getLogReader(app: package);
                if (reader is _IOSSimulatorLogReader) {
                  try {
                    await reader._ready.future.timeout(const Duration(seconds: 30));
                  } on TimeoutException {
                    globals.printError('The simulator log stream did not become ready.');
                    await vmServiceDiscovery?.cancel();
                    return LaunchResult.failed();
                  }
                }
              }

              // Launch the updated application in the simulator.''')
          replace_once('  Future<void> _start() async {\n    // Unified logging',
            '  Future<void> _start() async {\n    final ready = _ready = Completer<void>();\n    // Unified logging')
          replace_once('  final IOSSimulator device;\n\n  final String? _appName;',
            '  final IOSSimulator device;\n\n  var _ready = Completer<void>();\n\n  final String? _appName;')
          replace_once('      _deviceProcess?.stdout.transform(utf8LineDecoder).listen(_onUnifiedLoggingLine);', '''      _deviceProcess?.stdout.transform(utf8LineDecoder).listen((line) {
                  if (!ready.isCompleted) {
                    ready.complete();
                  }
                  _onUnifiedLoggingLine(line);
                });''')
          replace_once('      _deviceProcess?.stdout.transform(utf8LineDecoder).listen(_onSysLogDeviceLine);',
            '      _deviceProcess?.stdout.transform(utf8LineDecoder).listen(_onSysLogDeviceLine);\n      if (!ready.isCompleted) ready.complete();')
          replace_once('      _deviceProcess?.exitCode.whenComplete(() {',
            '      _deviceProcess?.exitCode.whenComplete(() {\n        if (!ready.isCompleted) ready.complete();')
          path.write_text(source)
          (sdk/'bin/cache/flutter_tools.snapshot').unlink(missing_ok=True)
          print('Readiness wait applied to the ephemeral screenshot SDK only.')
          PY
          dart format --output=none "$RUNNER_TEMP/powerleft-flutter/packages/flutter_tools/lib/src/ios/simulators.dart"
      - name: Prepare only the screenshot test and locked native libraries
        run: |
          flutter pub get --enforce-lockfile
          cp tool/store_capture_target.dart integration_test/store_capture_test.dart
          flutter build ios --config-only --debug --simulator --no-codesign --target=integration_test/store_capture_test.dart --dart-define=POWERLEFT_DISABLE_ADS_FOR_TESTING=true
          cd ios
          pod install
      - name: Boot an actual medium-size iPhone simulator
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/powerleft-simulators.json"
          DEVICE=$(python3 - "$RUNNER_TEMP/powerleft-simulators.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          choices=[d for devices in data['devices'].values() for d in devices if d.get('isAvailable') and d['name'] in ('iPhone 17 Pro','iPhone 16 Pro','iPhone 15 Pro','iPhone 16')]
          assert choices, 'No supported medium-size iPhone simulator available.'
          preferred={'iPhone 17 Pro':4,'iPhone 16 Pro':3,'iPhone 15 Pro':2,'iPhone 16':1}
          d=max(choices,key=lambda d:preferred[d['name']])
          print(d['udid'])
          PY
          )
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time '9:41' --batteryState charged --batteryLevel 100
          echo "POWERLEFT_SIMULATOR=$DEVICE" >> "$GITHUB_ENV"
      - name: Capture the real app in all six languages
        timeout-minutes: 12
        run: flutter drive --no-pub --debug --verbose -d "$POWERLEFT_SIMULATOR" --driver=tool/store_capture_driver.dart --target=integration_test/store_capture_test.dart --dart-define=POWERLEFT_DISABLE_ADS_FOR_TESTING=true
      - name: Record screenshot provenance
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,struct
          files=list(pathlib.Path('store-captures').glob('*/*.png'))
          assert len(files)==24
          rows=[]
          for p in sorted(files):
            raw=p.read_bytes(); width,height=struct.unpack('>II',raw[16:24])
            assert (width,height) in [(1206,2622),(1179,2556)], (p,width,height)
            rows.append({'path':str(p),'width':width,'height':height,'sha256':hashlib.sha256(raw).hexdigest()})
          pathlib.Path('store-captures/provenance.json').write_text(json.dumps({'source_commit':os.environ['GITHUB_SHA'],'release_ui_commit':'a8ea9b39b73646a05761d4f80150fab0546c5579','native_iPhone_simulator':True,'app_runtime_changes':False,'captures':rows},indent=2))
          print('All 24 PNGs have Apple-supported native screenshot dimensions.')
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: powerleft-actual-store-screenshots
          path: store-captures/
          if-no-files-found: error
          retention-days: 7
