name: PowerLeft actual App Store screenshots
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: powerleft-store-screenshots
  cancel-in-progress: false
jobs:
  capture-flow:
    if: github.repository == 'baewumnote-studio/powerleft-ios-public-build' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the verified Flutter toolchain
        run: |
          git clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/powerleft-flutter"
          echo "$RUNNER_TEMP/powerleft-flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/powerleft-flutter/bin/flutter" config --no-analytics
      - name: Check all localized capture paths before using macOS
        run: |
          flutter pub get --enforce-lockfile
          python3 - <<'PY'
          from pathlib import Path
          source=Path('tool/store_capture_target.dart').read_text()
          Path('test/store_capture_host_test.dart').write_text(source.replace('../test/support/preferences_test_support.dart','support/preferences_test_support.dart'))
          PY
          flutter test --no-pub --dart-define=POWERLEFT_DISABLE_ADS_FOR_TESTING=true --dart-define=POWERLEFT_CAPTURE_HOST_CHECK=true test/store_capture_host_test.dart
  capture:
    needs: capture-flow
    if: github.repository == 'baewumnote-studio/powerleft-ios-public-build' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      COCOAPODS_DISABLE_STATS: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Confirm the approved release UI is preserved
        run: |
          python3 - <<'PY'
          import subprocess
          changed = subprocess.check_output(['git','diff','--name-only','a8ea9b39b73646a05761d4f80150fab0546c5579','HEAD'],text=True).splitlines()
          allowed = {'.github/workflows/store-screenshots.yml','tool/store_capture_target.dart','tool/store_capture_driver.dart'}
          assert set(changed).issubset(allowed), changed
          print('Release code, assets, dependencies and native configuration unchanged.')
          PY
      - name: Install the previously verified Flutter toolchain
        run: |
          test -d "$DEVELOPER_DIR"
          git clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/powerleft-flutter"
          echo "$RUNNER_TEMP/powerleft-flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/powerleft-flutter/bin/flutter" config --no-analytics
          "$RUNNER_TEMP/powerleft-flutter/bin/flutter" precache --ios
      - name: Prepare only the screenshot test and locked native libraries
        run: |
          flutter pub get --enforce-lockfile
          cp tool/store_capture_target.dart integration_test/store_capture_test.dart
          flutter build ios --config-only --debug --simulator --no-codesign --target=integration_test/store_capture_test.dart --dart-define=POWERLEFT_DISABLE_ADS_FOR_TESTING=true
          cd ios
          pod install
      - name: Boot an actual medium-size iPhone simulator
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/powerleft-simulators.json"
          DEVICE=$(python3 - "$RUNNER_TEMP/powerleft-simulators.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          choices=[d for devices in data['devices'].values() for d in devices if d.get('isAvailable') and d['name'] in ('iPhone 17 Pro','iPhone 16 Pro','iPhone 15 Pro','iPhone 16')]
          assert choices, 'No supported medium-size iPhone simulator available.'
          preferred={'iPhone 17 Pro':4,'iPhone 16 Pro':3,'iPhone 15 Pro':2,'iPhone 16':1}
          d=max(choices,key=lambda d:preferred[d['name']])
          print(d['udid'])
          PY
          )
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time '9:41' --batteryState charged --batteryLevel 100
          echo "POWERLEFT_SIMULATOR=$DEVICE" >> "$GITHUB_ENV"
      - name: Capture the real app in all six languages
        run: flutter drive --no-pub --debug -d "$POWERLEFT_SIMULATOR" --driver=tool/store_capture_driver.dart --target=integration_test/store_capture_test.dart --dart-define=POWERLEFT_DISABLE_ADS_FOR_TESTING=true
      - name: Record screenshot provenance
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,struct
          files=list(pathlib.Path('store-captures').glob('*/*.png'))
          assert len(files)==24
          rows=[]
          for p in sorted(files):
            raw=p.read_bytes(); width,height=struct.unpack('>II',raw[16:24])
            assert (width,height) in [(1206,2622),(1179,2556)], (p,width,height)
            rows.append({'path':str(p),'width':width,'height':height,'sha256':hashlib.sha256(raw).hexdigest()})
          pathlib.Path('store-captures/provenance.json').write_text(json.dumps({'source_commit':os.environ['GITHUB_SHA'],'release_ui_commit':'a8ea9b39b73646a05761d4f80150fab0546c5579','native_iPhone_simulator':True,'app_runtime_changes':False,'captures':rows},indent=2))
          print('All 24 PNGs have Apple-supported native screenshot dimensions.')
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: powerleft-actual-store-screenshots
          path: store-captures/
          if-no-files-found: error
          retention-days: 7
